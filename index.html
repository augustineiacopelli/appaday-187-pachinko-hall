<style>
:root{--acc:#276EB7;--acc2:#8cbcf2;--bg:#070b12;--panel:#0f1624;--panel2:#162033;--ink:#e9eef7;--mut:#9fb0c8;--line:#22304a;--amber:#ffb347;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc2)}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
#shell{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#0f1b33 0%,var(--bg) 60%)}
.screen{display:none;position:absolute;inset:0;flex-direction:column;min-height:0}
.screen.active{display:flex}
body.nopixi .screen{display:none!important}
.lbl{font-size:.62rem;letter-spacing:.14em;color:var(--mut);display:block;line-height:1}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.icon-btn svg{width:22px;height:22px;stroke:var(--acc2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{background:var(--acc)}
.btn{min-height:44px;padding:0 18px;background:var(--acc);color:#fff;border:0;border-radius:12px;font-weight:700;font-size:1rem;letter-spacing:.04em}
.btn:active{filter:brightness(1.2)}
.bar{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--st)) calc(12px + var(--sr)) 8px calc(12px + var(--sl));background:linear-gradient(180deg,#0e1a31,#0a1222);border-bottom:2px solid var(--acc)}
.bar .title{flex:1;min-width:0}
.bar h1{margin:0;font-size:clamp(1.05rem,5.2vw,1.5rem);letter-spacing:.06em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:.7rem;color:var(--mut);letter-spacing:.12em}
.portal{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:12px;text-decoration:none;font-weight:700;font-size:.78rem;letter-spacing:.08em;background:var(--panel2)}
.bankbox{text-align:right;min-width:3.4rem}
.bankbox b{display:block;font-family:Orbitron,monospace;font-size:clamp(1.05rem,5vw,1.35rem);color:var(--amber);text-shadow:0 0 8px rgba(255,179,71,.4);line-height:1.15}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:12px;padding:12px calc(12px + var(--sr)) 4px calc(12px + var(--sl))}
.seat{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px 14px 12px 18px;background:linear-gradient(160deg,#131d31,#0c1322);border:1px solid var(--line);border-radius:16px;box-shadow:inset 5px 0 0 var(--pal);overflow:hidden}
.seat::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0 0,var(--pal),transparent 55%);opacity:.14;pointer-events:none}
.seat>*{position:relative}
.seat-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.seat-head h2{margin:0;font-size:1.25rem;letter-spacing:.04em;flex:1;min-width:0}
.era{font-family:Orbitron,monospace;font-size:.78rem;color:var(--mut)}
.fam{font-size:.66rem;letter-spacing:.14em;padding:3px 8px;border:1px solid var(--acc);border-radius:999px;color:var(--acc2)}
.counter{display:flex;align-items:center;gap:12px;padding:8px 10px;background:#0a0d14;border:1px solid #2a2f3d;border-radius:12px}
.led-wrap{display:flex;flex-direction:column;gap:3px}
.led-lbl{font-size:.6rem;letter-spacing:.16em;color:var(--mut)}
.led{font-family:Orbitron,monospace;font-weight:800;font-size:clamp(1.9rem,9vw,2.4rem);color:var(--amber);text-shadow:0 0 12px rgba(255,179,71,.55);letter-spacing:.08em;line-height:1}
.cnt-side{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:.8rem;color:var(--mut)}
.cnt-side b{color:var(--ink)}
.lamp{font-size:.7rem;font-weight:700;letter-spacing:.12em;padding:3px 8px;border-radius:6px}
.lamp.hot{background:#ff4d5e;color:#fff;box-shadow:0 0 10px rgba(255,77,94,.6)}
.lamp.fast{background:#2f9bff;color:#04101f}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:#0b1220}
.chip em{font-style:normal;color:var(--acc2);margin-left:5px;font-weight:700}
.chip.none{color:var(--mut)}
.tip{margin:0;font-size:.86rem;line-height:1.4;color:#c9d6ea}
.seat-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.diff{display:inline-flex;gap:4px}
.diff i{width:12px;height:12px;border-radius:3px;border:1px solid var(--acc);background:transparent}
.diff i.on{background:var(--acc)}
.foot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px calc(18px + var(--sb));font-size:.78rem;color:var(--mut);text-align:center}
.foot a{display:inline-flex;align-items:center;min-height:44px;font-weight:700;letter-spacing:.06em}
/* cabinet */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:calc(6px + var(--st)) calc(10px + var(--sr)) 6px calc(10px + var(--sl));background:linear-gradient(180deg,#0e1a31,#0a1222);border-bottom:2px solid var(--acc)}
.hud-name{flex:1;min-width:0;font-weight:700;font-size:clamp(.95rem,4.4vw,1.2rem);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-bank{text-align:right;min-width:3.2rem}
.hud-bank b{display:block;font-family:Orbitron,monospace;font-size:clamp(1rem,4.6vw,1.25rem);color:var(--amber);line-height:1.1}
.hud-row{display:flex;align-items:center;gap:12px;width:100%;font-size:.78rem;color:var(--mut);letter-spacing:.08em}
.hud-row b{color:var(--ink);font-family:Orbitron,monospace}

.pill.reach{background:#7a4b00;border-color:#ffb347;color:#ffe3b0}
.pill.jp{background:#7d1021;border-color:#ff5a6e;color:#fff}
.pill.kaku{background:#8a2331;border-color:#ff8a98;color:#fff}
.pill.jitan{background:#0d3a6b;border-color:var(--acc2);color:#dcecff}
#stage{position:relative;flex:1;min-height:0;background:#05080e;overflow:hidden;display:flex;flex-direction:column}
#pixi-host{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#controls{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px calc(12px + var(--sr)) calc(8px + var(--sb)) calc(12px + var(--sl));background:#070b12;border-top:2px solid var(--acc);z-index:5}
#stream{display:flex;flex-direction:row;gap:6px;flex:1;min-width:0}
#stream button,#aim{flex:1;min-width:48px;min-height:48px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-weight:700;letter-spacing:.08em;font-size:.85rem}
#stream button.on{background:var(--acc);border-color:var(--acc2);color:#fff}
#aim{font-size:.78rem}
#aim.on{border-color:var(--acc2)}
#aim.demand{background:var(--amber);border-color:#fff;color:#1b1204;animation:pulse .6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,179,71,.9)}to{box-shadow:0 0 0 8px rgba(255,179,71,0)}}
@media (prefers-reduced-motion:reduce){#aim.demand{animation:none}}
#dial{position:relative;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#26385a,#0a101c 70%);border:2px solid var(--acc);touch-action:none;cursor:grab;flex:none}
#dial svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#dial-track{fill:none;stroke:#26334d;stroke-width:6;stroke-linecap:round}
#dial-val{fill:none;stroke:var(--amber);stroke-width:6;stroke-linecap:round}
#dial-thumb{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dfe8f7,#7e8da6 60%,#39465c);border:2px solid #0a101c;box-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
#dial-read{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:Orbitron,monospace;font-weight:800;font-size:.85rem;color:#fff;pointer-events:none;text-shadow:0 1px 3px #000;z-index:2}
#refill{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:6;box-shadow:0 0 0 3px rgba(255,255,255,.15),0 10px 30px rgba(0,0,0,.6)}
/* overlays */
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,6,12,.78);z-index:50;padding:calc(12px + var(--st)) 12px calc(12px + var(--sb))}
.overlay.open{display:flex}
.sheet{width:min(94vw,30rem);max-height:88svh;overflow-y:auto;background:var(--panel);border:1px solid var(--acc);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.sheet h2{margin:0 0 10px;font-size:1.3rem;letter-spacing:.05em}
.sheet h2 small{font-family:Orbitron,monospace;font-size:.7rem;color:var(--mut);margin-left:6px}
.sheet h3{margin:14px 0 4px;font-size:.78rem;letter-spacing:.16em;color:var(--acc2)}
.sheet p{margin:0 0 6px;line-height:1.5;font-size:.92rem;color:#d3dff0}
.sheet .fine{font-size:.76rem;color:var(--mut)}
.sheet .btn{margin-top:12px;width:100%}
.row-btn{display:block;width:100%;min-height:48px;margin:8px 0;padding:0 14px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:.95rem}
.row-btn[aria-pressed="true"]{border-color:var(--acc2)}
.row-btn.danger{border-color:#7d1021;color:#ffb3bd}
.row-btn.danger.armed{background:#7d1021;color:#fff}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#cdn-error{z-index:100;background:var(--bg)}
</style>

/* Decide one spin from one draw. ctx: {mode, hid, kenri}. Pure. */
function evalSpin(cab, out, ctx) {
  var o = cab.odds, u = out.u, n = cab.lcd.symbols.length;
  var rate = ctx.mode === 'kakuhen' ? o.kaku : (ctx.mode === 'jitan' ? o.jitan : o.base);
  if (ctx.hid) rate = o.kaku;
  var usedKenri = false;
  if (ctx.kenri && o.kenriRate) { rate = Math.max(rate, o.kenriRate); usedKenri = true; }
  var hit = u[0] < rate, reach = 0, syms;
  if (o.reach > 0) {
    if (hit) reach = 1 + (u[2] < o.superHit ? 1 : 0);
    else if (u[1] < o.reach) reach = 1 + (u[2] < o.superRate ? 1 : 0);
  }
  var a = Math.floor(u[4] * n) % n, b = (a + 1 + Math.floor(u[3] * (n - 1))) % n, c;
  if (hit) syms = [a, a, a];
  else if (reach) syms = [a, b, a];
  else {
    c = (b + 1 + Math.floor(u[7] * (n - 1))) % n;
    if (c === a) c = (c + 1) % n;
    syms = [a, b, c];
  }
  return {hit: hit, reach: reach, syms: syms, usedKenri: usedKenri, rounds: 0, next: 'normal', duelWin: false};

    rules.route(cab, out, res);
    rec.spins++; rec.since++;
    if (res.hit) {
      rec.history.unshift({s: rec.since, r: res.rounds});
      if (rec.history.length > 12) rec.history.length = 12;
      rec.since = 0; hid = 0;
      if (res.next === 'kakuhen') mode = 'kakuhen';
      else if (res.next === 'jitan') { mode = 'jitan'; jl = PHYS.JITAN_SPINS; }
      else if (res.next === 'hidden') { mode = 'normal'; hid = 100; }
      else mode = 'normal';
    } else {
      if (mode === 'jitan') { jl--; if (jl <= 0) { jl = 0; mode = 'normal'; } }
      if (hid > 0) hid--;

var IN = {stream: 'L', power: 0.35, dialHeld: false, stageHeld: false, keyHeld: false, cd: 0, pid: null};
var DIAL = {R: 27};

function polarXY(cx, cy, r, deg) {
  var a = deg * Math.PI / 180;
  return {x: cx + r * Math.sin(a), y: cy - r * Math.cos(a)};
}
function arcPath(cx, cy, r, a0, a1) {
  var p0 = polarXY(cx, cy, r, a0), p1 = polarXY(cx, cy, r, a1);
  return 'M' + p0.x.toFixed(2) + ' ' + p0.y.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + ((a1 - a0) > 180 ? 1 : 0) + ' 1 ' + p1.x.toFixed(2) + ' ' + p1.y.toFixed(2);
}
function renderDial() {
  var th = -135 + 270 * IN.power, pt = polarXY(0, 0, DIAL.R, th);
  var thumb = document.getElementById('dial-thumb');
  thumb.style.transform = 'translate(' + pt.x.toFixed(1) + 'px,' + pt.y.toFixed(1) + 'px)';
  document.getElementById('dial-val').setAttribute('d', IN.power > 0.004 ? arcPath(50, 50, 40, -135, th) : '');
  document.getElementById('dial-read').textContent = String(Math.round(IN.power * 100));
  var d = document.getElementById('dial');
  d.setAttribute('aria-valuenow', String(Math.round(IN.power * 100)));
  if (typeof VIEW !== 'undefined' && VIEW) VIEW.aim.power = IN.power;
}
function setPower(p) { IN.power = clamp(p, 0, 1); renderDial(); }
function setStream(s) {
  IN.stream = s;
  var bs = document.querySelectorAll('#stream button');
  for (var i = 0; i < bs.length; i++) {
    var on = bs[i].getAttribute('data-stream') === s;
    bs[i].classList.toggle('on', on);
    bs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  document.getElementById('aim').classList.toggle('on', s === 'R');
  if (VIEW) VIEW.aim.stream = s;
}
function powerFromEvent(e) {
  var r = document.getElementById('dial').getBoundingClientRect();
  var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return IN.power;
  var ang = Math.atan2(dx, -dy) * 180 / Math.PI;
  if (ang < -135) return 0;
  if (ang > 135) return 1;
  return (ang + 135) / 270;
}
function launching() { return IN.dialHeld || IN.stageHeld || IN.keyHeld; }
function releaseAll() { IN.dialHeld = false; IN.stageHeld = false; IN.keyHeld = false; }
function tryLaunch() {
  if (!WORLD || !MACH) return;
  if (STATE.bank <= 0) { syncHud(true); return; }
  if (WORLD.active() >= MAX_BALLS) return;
  var b = WORLD.launch(IN.stream, IN.power, jitterStream);
  if (b) {
    STATE.bank--; IN.cd = PHYS.LAUNCH_CD;
    Sfx.launch(); markDirty();
  }
}
function bindInput() {
  var dial = document.getElementById('dial'), host = document.getElementById('pixi-host');
  document.addEventListener('pointerdown', function () { Sfx.unlock(); }, {passive: true});
  dial.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    IN.dialHeld = true; IN.pid = e.pointerId;
    try { dial.setPointerCapture(e.pointerId); } catch (x) {}
    setPower(powerFromEvent(e));
  }, {passive: false});
  dial.addEventListener('pointermove', function (e) {
    if (!IN.dialHeld || e.pointerId !== IN.pid) return;
    e.preventDefault();
    setPower(powerFromEvent(e));
  }, {passive: false});
  var endDial = function (e) { if (e.pointerId === IN.pid) { IN.dialHeld = false; IN.pid = null; } };
  dial.addEventListener('pointerup', endDial, {passive: true});
  dial.addEventListener('pointercancel', endDial, {passive: true});
  host.addEventListener('pointerdown', function (e) {
    e.preventDefault(); IN.stageHeld = true;
    try { host.setPointerCapture(e.pointerId); } catch (x) {}
  }, {passive: false});
  var endStage = function () { IN.stageHeld = false; };
  host.addEventListener('pointerup', endStage, {passive: true});
  host.addEventListener('pointercancel', endStage, {passive: true});
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', function () { if (document.hidden) releaseAll(); });
  var sb = document.querySelectorAll('#stream button');
  for (var i = 0; i < sb.length; i++) {
    sb[i].addEventListener('click', function (e) { setStream(e.currentTarget.getAttribute('data-stream')); });
  }
  document.getElementById('aim').addEventListener('click', function () { setStream('R'); });
  dial.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setPower(IN.power - 0.04); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setPower(IN.power + 0.04); }
  });
  document.addEventListener('keydown', function (e) {
    if (UI.screen !== 'cabinet' || UI.overlay) return;
    var tag = e.target && e.target.tagName;
    if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); IN.keyHeld = true; Sfx.unlock(); }
    else if (e.key === 'l' || e.key === 'L') setStream('L');
    else if (e.key === 'r' || e.key === 'R') setStream('R');
    else if (e.key === 'ArrowLeft' && tag !== 'DIV') setPower(IN.power - 0.04);
    else if (e.key === 'ArrowRight' && tag !== 'DIV') setPower(IN.power + 0.04);
  });
  document.addEventListener('keyup', function (e) { if (e.key === ' ') IN.keyHeld = false; });
  document.getElementById('dial-track').setAttribute('d', arcPath(50, 50, 40, -135, 135));
  renderDial();
  setStream('L');
}

/* ===== SECTION 11: UI ===== */
var STATE = null, APPX = null, VIEW = null, WORLD = null, MACH = null, CAB = null;
var UI = {screen: 'hall', overlay: null, dirty: false, acc: 0, hudT: 0, resetT: 0, resetArmed: false, liveT: 0};

function $(id) { return document.getElementById(id); }
function pad3(n) { n = String(Math.min(n, 999)); while (n.length < 3) n = '0' + n; return n; }
function markDirty() { UI.dirty = true; }
function flushSave() {
  if (!STATE) return;
  if (MACH) MACH.persist();
  saveState(STATE); UI.dirty = false;
}
function announce(msg) { var l = $('live'); if (l) l.textContent = msg; }

/* ---- hall ---- */
var FAMILY_TAG = {tulip: 'TULIP', wing: 'WING', digi: 'DIGI'};
function familyLabel(cab) {
  if (cab.variant === 'senpuku') return 'DIGI HIDDEN';
  if (cab.variant === 'battle') return 'DIGI DUEL';
  if (cab.variant === 'kenri') return 'DIGI GATES';
  return FAMILY_TAG[cab.family];
}
function seatHtml(cab, rec) {
  var pal = PALETTES[cab.palette], i, chips = '', stars = '';
  for (i = 0; i < Math.min(6, rec.history.length); i++) chips += '<span class="chip">' + rec.history[i].s + '<em>' + rec.history[i].r + 'R</em></span>';
  if (!chips) chips = '<span class="chip none">no hits logged</span>';
  for (i = 0; i < 5; i++) stars += '<i' + (i < cab.difficulty ? ' class="on"' : '') + '></i>';
  var lamp = '';
  if (rec.mode === 'kakuhen') lamp = '<span class="lamp hot">HOT</span>';
  else if (rec.mode === 'jitan') lamp = '<span class="lamp fast">FAST ' + rec.jl + '</span>';
  return '<article class="seat" style="--pal:' + hex6(pal.glow) + ';--pal2:' + hex6(pal.plate) + '">' +
    '<div class="seat-head"><span class="era">' + cab.era + '</span><h2>' + cab.name + '</h2><span class="fam">' + familyLabel(cab) + '</span></div>' +
    '<div class="counter" aria-label="Data counter">' +
      '<div class="led-wrap"><span class="led-lbl">SINCE HIT</span><b class="led">' + pad3(rec.since) + '</b></div>' +
      '<div class="cnt-side"><span class="cnt-line">SPINS <b>' + rec.spins + '</b></span>' + lamp + '</div>' +
    '</div>' +
    '<div class="chips" aria-label="Recent hits, spins before each hit and rounds">' + chips + '</div>' +
    '<p class="tip">' + cab.tip + '</p>' +
    '<div class="seat-foot"><span class="diff" role="img" aria-label="Difficulty ' + cab.difficulty + ' of 5">' + stars + '</span>' +
    '<button class="btn sit" data-sit="' + cab.id + '">Sit down</button></div></article>';
}
function renderSeatCards() {
  var h = '';
  for (var i = 0; i < CABS.length; i++) h += seatHtml(CABS[i], STATE.cabs[CABS[i].id]);
  $('seat-grid').innerHTML = h;
  $('bank-hall').textContent = STATE.bank;
}
function setScreen(name) {
  UI.screen = name;
  $('hall').classList.toggle('active', name === 'hall');
  $('cabinet').classList.toggle('active', name === 'cabinet');
  if (APPX) { if (name === 'cabinet') APPX.ticker.start(); else APPX.ticker.stop(); }
}
function showHall() {
  releaseAll();
  setScreen('hall');
  renderSeatCards();
}

/* ---- cabinet ---- */
function machineEvent(type, d) {
  if (type === 'persist') { markDirty(); return; }
  var v = VIEW;
  if (type === 'pay') {
    STATE.bank += d.n; markDirty();
    if (v && d.x) { v.popup(d.x, d.y, d.n, d.why === 'round' ? v.pal.hot : 0xffffff); }
    if (d.why === 'start' || d.why === 'round' || d.why === 'catch') Sfx.pocket();
  } else if (type === 'sensor') {
    if (v && (d.kind === 'start' || d.kind === 'pocket' || d.kind === 'catch')) {
      v.burst(d.x, d.y, v.pal.hot, d.kind === 'start' ? 10 : 6, 150);
      if (d.kind === 'start') v.startFlash = 1;
    }
  } else if (type === 'reach') {
    Sfx.reach(); announce(d === 2 ? 'Super reach' : 'Reach');
  } else if (type === 'jackpot') {
    Sfx.stinger(); if (v) { v.showBanner('JACKPOT'); v.flashAmt = 1; }
    announce('Jackpot. ' + d.rounds + ' rounds.');
  } else if (type === 'round') {
    Sfx.cascade();
    if (v) v.showBanner('ROUND ' + d);
    announce('Round ' + d + (CAB.payout.aim === 'right' ? '. Shoot right.' : '.'));
  } else if (type === 'duel') {
    Sfx.thud(); announce('Duel');
  } else if (type === 'jackpotEnd') {
    var t = d === 'kakuhen' ? 'KAKUHEN' : (d === 'jitan' ? 'JITAN' : '');
    if (t && v) { v.showBanner(t); v.flashAmt = 0.7; }
    announce(d === 'kakuhen' ? 'Kakuhen. High odds.' : (d === 'jitan' ? 'Jitan. Fast spins.' : 'Jackpot over.'));
    flushSave();
  } else if (type === 'kenri') {
    Sfx.stinger(); if (v) { v.showBanner('KENRI'); v.flashAmt = 0.6; }
    announce('Kenri earned. The next spin is likely a hit.');
  } else if (type === 'gate') {
    if (!d.ok) Sfx.thud();
  }
}
function showCabinet(id) {
  var cab = cabById(id);
  if (!cab || !APPX) return;
  CAB = cab;
  WORLD = new World(cab);
  MACH = createMachine(cab, STATE.cabs[id], WORLD);
  MACH.listener = machineEvent;
  WORLD.onPin = function (x, y, spd) { Sfx.pin(spd); if (VIEW) VIEW.pinSpark(x, y, spd); };
  if (VIEW) { VIEW.destroy(); VIEW = null; }
  VIEW = new RView(APPX, cab, WORLD, MACH, STATE.settings);
  VIEW.aim.stream = IN.stream; VIEW.aim.power = IN.power;
  $('hud-name').textContent = cab.name;
  $('cabinet').style.setProperty('--pal', hex6(PALETTES[cab.palette].glow));
  UI.acc = 0; UI.hudT = 0; IN.cd = 0;
  setScreen('cabinet');
  resizeStage();
  syncHud(true);
  announce(cab.name + '. ' + cab.tip);
}
function leaveCabinet() {
  releaseAll();
  if (MACH) { MACH.flush(); MACH.listener = null; }
  flushSave();
  if (WORLD) WORLD.clear();
  showHall();
}
function resizeStage() {
  if (!APPX || !VIEW) return;
  var host = $('pixi-host'), w = host.clientWidth, h = host.clientHeight;
  if (w < 10 || h < 10) return;
  APPX.renderer.resize(w, h);
  VIEW.layout(w, h);
}
function syncHud(force) {
  if (!MACH) return;
  $('hud-bank').textContent = STATE.bank;
  var lb = MACH.label(), pill = $('hud-mode');
  if (pill.textContent !== lb.text) pill.textContent = lb.text;
  pill.className = 'pill ' + lb.cls;
  $('hud-spins').textContent = MACH.rec.spins;
  $('hud-since').textContent = MACH.rec.since;
  var dem = MACH.aimDemand() && IN.stream !== 'R';
  $('aim').classList.toggle('demand', dem);
  var out = STATE.bank <= 0 && WORLD.active() === 0 && !MACH.spin;
  $('refill').hidden = !(STATE.bank <= 0 && WORLD.active() === 0);
}
function frame(tk) {
  if (UI.screen !== 'cabinet' || !MACH || !VIEW) return;
  var dt = Math.min(tk.deltaMS / 1000, 0.1);
  Sfx.frame();
  IN.cd -= dt;
  if (launching() && IN.cd <= 0 && !UI.overlay) tryLaunch();
  UI.acc += dt;
  var n = 0;
  while (UI.acc >= PHYS.DT && n < 8) { WORLD.step(PHYS.DT); UI.acc -= PHYS.DT; n++; }
  if (n >= 8) UI.acc = 0;
  MACH.update(dt);
  VIEW.update(dt);
  UI.hudT -= dt;
  if (UI.hudT <= 0) { syncHud(); UI.hudT = 0.12; }
}

/* ---- overlays ---- */
function openOverlay(id) {
  releaseAll();
  closeOverlays(true);
  $(id).classList.add('open');
  UI.overlay = id;
  var f = $(id).querySelector('button');
  if (f) f.focus();
}
function closeOverlays(keep) {
  var ids = ['settings-modal', 'help-sheet'];
  for (var i = 0; i < ids.length; i++) $(ids[i]).classList.toggle('open', false);
  if (!keep) UI.overlay = null;
}
function oneIn(x) { return x > 0 ? '1 in ' + Math.round(1 / x) : 'none'; }
function buildHelp() {
  var c = CAB || CABS[0], o = c.odds, p = c.payout, h = '';
  h += '<h2 id="help-title">' + c.name + ' <small>' + c.era + '</small></h2>';
  h += '<p>' + c.blurb + '</p>';
  h += '<h3>Playing</h3><p>Hold the dial, or press and hold the stage, to keep firing. Turn the dial to set launch power, and pick the left or right stream. ' +
       'The marker above the pins shows where your shot lands. Each shot costs one ball and the start pocket pays ' + p.startPay + '.</p>';
  h += '<h3>Odds per spin</h3><p>Base ' + oneIn(o.base) + '.';
  if (o.kaku !== o.base) h += ' Kakuhen ' + oneIn(o.kaku) + ', lasting until the next hit.';
  if (c.odds.kakuRate > 0 && c.variant !== 'battle') h += ' After a hit, ' + Math.round(o.kakuRate * 100) + ' percent go to kakuhen and the rest to jitan.';
  if (c.odds.kakuRate > 0) h += ' Jitan gives ' + PHYS.JITAN_SPINS + ' fast spins at base odds.';
  if (o.reach > 0) h += ' About ' + Math.round(o.reach * 100) + ' percent of misses reach, and some are super reach.';
  h += '</p>';
  h += '<h3>Jackpot</h3><p>' + p.rounds + ' rounds of up to ' + p.balls + ' balls, ' + p.perBall + ' each.' +
       (p.aim === 'right' ? ' The attacker only catches right stream shots, so flip the stream when the AIM lamp pulses.' : ' Any stream works while the feature is open.') + '</p>';
  if (c.variant === 'senpuku') h += '<h3>Hidden mode</h3><p>About ' + Math.round(c.senpuku.p2R * 100) + ' percent of hits are a short 2R. Roughly half of those secretly switch on high odds for ' + 100 + ' spins. The machine looks normal, so read the history.</p>';
  if (c.variant === 'battle') h += '<h3>Duel</h3><p>After the rounds the LCD runs a duel. Win and you get kakuhen. Lose and you get jitan.</p>';
  if (c.variant === 'kenri') h += '<h3>Gates</h3><p>Pass the three gates in order, 1 then 2 then 3. A wrong gate resets the chain, and gate 1 starts it again. Completing it gives the right to a very likely hit on the next spin.</p>';
  if (c.family === 'tulip') h += '<h3>Tulips</h3><p>A ball in the bell pocket opens every tulip for two seconds. A jackpot holds them open.</p>';
  if (c.family === 'wing') h += '<h3>Wings</h3><p>The wings clap on a steady beat. A jackpot latches them open and every ball in the pocket pays.</p>';
  h += '<h3>Reading tip</h3><p>' + c.tip + '</p>';
  h += '<p class="fine">Leaving the seat settles any spins still waiting. Play balls only, no money.</p>';
  h += '<button class="btn" id="help-close">Got it</button>';
  $('help-body').innerHTML = h;
  $('help-close').addEventListener('click', function () { closeOverlays(); });
}
function syncSettingsUi() {
  $('set-sound').textContent = 'Sound: ' + (STATE.settings.sound ? 'On' : 'Off');
  $('set-sound').setAttribute('aria-pressed', STATE.settings.sound ? 'true' : 'false');
  $('set-reduced').textContent = 'Reduced effects: ' + (STATE.settings.reduced ? 'On' : 'Off');
  $('set-reduced').setAttribute('aria-pressed', STATE.settings.reduced ? 'true' : 'false');
  $('set-reset').textContent = UI.resetArmed ? 'Tap again to confirm' : 'Reset balls and histories';
  $('set-reset').classList.toggle('armed', UI.resetArmed);
}
function doReset() {
  var keep = STATE.settings;
  STATE = defaultState();
  STATE.settings = keep;
  saveState(STATE);
  UI.resetArmed = false;
  syncSettingsUi();
  closeOverlays();
  if (UI.screen === 'cabinet') { if (WORLD) WORLD.clear(); MACH = null; showHall(); }
  else renderSeatCards();
  announce('Balls and histories reset.');
}
function bindUi() {
  $('seat-grid').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-sit]') : null;
    if (b) { Sfx.unlock(); showCabinet(b.getAttribute('data-sit')); }
  });
  $('btn-back').addEventListener('click', leaveCabinet);
  $('gear-hall').addEventListener('click', function () { syncSettingsUi(); openOverlay('settings-modal'); });
  $('btn-gear').addEventListener('click', function () { syncSettingsUi(); openOverlay('settings-modal'); });
  $('btn-help').addEventListener('click', function () { buildHelp(); openOverlay('help-sheet'); });
  $('set-close').addEventListener('click', function () { closeOverlays(); flushSave(); });
  $('set-sound').addEventListener('click', function () { STATE.settings.sound = !STATE.settings.sound; syncSettingsUi(); markDirty(); });
  $('set-reduced').addEventListener('click', function () {
    STATE.settings.reduced = !STATE.settings.reduced; syncSettingsUi(); markDirty();
    if (VIEW) VIEW.applyEffects();
  });
  $('set-reset').addEventListener('click', function () {
    if (!UI.resetArmed) {
      UI.resetArmed = true; syncSettingsUi();
      clearTimeout(UI.resetT);
      UI.resetT = setTimeout(function () { UI.resetArmed = false; syncSettingsUi(); }, 4000);
    } else { clearTimeout(UI.resetT); doReset(); }
  });
  $('refill').addEventListener('click', function () {
    STATE.bank += 200; markDirty(); syncHud(true); announce('The hall lends you 200 balls.');
  });
  var ov = ['settings-modal', 'help-sheet'];
  for (var i = 0; i < ov.length; i++) {
    $(ov[i]).addEventListener('click', function (e) { if (e.target === e.currentTarget) { closeOverlays(); } });
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && UI.overlay) closeOverlays(); });
  window.addEventListener('resize', resizeStage);
  window.addEventListener('orientationchange', function () { setTimeout(resizeStage, 250); });
  if (window.ResizeObserver) new ResizeObserver(function () { resizeStage(); }).observe($('pixi-host'));
  document.addEventListener('visibilitychange', function () { if (document.hidden) flushSave(); });
  window.addEventListener('pagehide', flushSave);
  setInterval(function () { if (UI.dirty) flushSave(); }, 1500);
}

/* ===== SECTION 12: BOOT ===== */
function showFatal(title, body) {
  var e = $('cdn-error');
  if (e) {
    e.querySelector('h2').textContent = title;
    e.querySelector('p').textContent = body;
    e.classList.add('open');
  }
  document.body.classList.add('nopixi');
}
async function boot() {
  if (typeof PIXI === 'undefined') {
    showFatal('The renderer did not load', 'PixiJS could not be fetched from the network. Check your connection and reload the page.');
    return;
  }
  STATE = loadState();
  Sfx.on = function () { return !!(STATE && STATE.settings.sound); };
  bindUi();
  bindInput();
  renderSeatCards();
  setScreen('hall');
  var app = new PIXI.Application();
  /* v8 initializes asynchronously, so the application is awaited here and never at top level */
  await app.init({
    width: 320, height: 480, background: 0x05080e, antialias: true,
    resolution: Math.min(window.devicePixelRatio || 1, 2), autoDensity: true
  });
  APPX = app;
  var host = $('pixi-host');
  app.canvas.style.display = 'block';
  app.canvas.style.touchAction = 'none';
  host.appendChild(app.canvas);
  bakeTextures();
  app.ticker.add(frame);
  app.ticker.stop();
  if (document.fonts && document.fonts.ready) {
    await Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1200); })]);
  }
  document.documentElement.classList.add('ready');
}
document.addEventListener('DOMContentLoaded', function () {
  boot().catch(function (err) {
    if (window.console) console.error(err);
    showFatal('The renderer could not start', 'This browser could not start WebGL graphics. Try another browser or reload the page.');
  });
});
</script>
</body>
</html>
