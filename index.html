<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="https://augustineiacopelli.github.io/appaday/icons/187.png">
<meta name="apple-mobile-web-app-title" content="Pachinko">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<script src="https://augustineiacopelli.github.io/appaday/save.js" defer></script>
<title>Pachinko Hall | AppADay 187</title>
<meta name="theme-color" content="#070b12">
<meta name="description" content="Seven pachinko cabinets from 1962 tulips to the ball-less smart machine. Rent balls, read the counters, exchange at the window. Seeded odds, custom physics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
<style>
:root{--acc:#276EB7;--acc2:#8cbcf2;--bg:#070b12;--panel:#0f1624;--panel2:#162033;--ink:#e9eef7;--mut:#9fb0c8;--line:#22304a;--amber:#ffb347;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc2)}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
#shell{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 70% at 50% 0%,#0f1b33 0%,var(--bg) 60%)}
.screen{display:none;position:absolute;inset:0;flex-direction:column;min-height:0}
.screen.active{display:flex}
body.nopixi .screen{display:none!important}
.lbl{font-size:.62rem;letter-spacing:.14em;color:var(--mut);display:block;line-height:1}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.icon-btn svg{width:22px;height:22px;stroke:var(--acc2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{background:var(--acc)}
.btn{min-height:44px;padding:0 18px;background:var(--acc);color:#fff;border:0;border-radius:12px;font-weight:700;font-size:1rem;letter-spacing:.04em}
.btn:active{filter:brightness(1.2)}
.bar{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--st)) calc(12px + var(--sr)) 8px calc(12px + var(--sl));background:linear-gradient(180deg,#0e1a31,#0a1222);border-bottom:2px solid var(--acc)}
.bar .title{flex:1;min-width:0}
.bar h1{margin:0;font-size:clamp(1.05rem,5.2vw,1.5rem);letter-spacing:.06em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:.7rem;color:var(--mut);letter-spacing:.12em}
.portal{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:12px;text-decoration:none;font-weight:700;font-size:.78rem;letter-spacing:.08em;background:var(--panel2)}
.bankbox{text-align:right;min-width:3.4rem}
.bankbox b{display:block;font-family:Orbitron,monospace;font-size:clamp(1.05rem,5vw,1.35rem);color:var(--amber);text-shadow:0 0 8px rgba(255,179,71,.4);line-height:1.15}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#seat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:12px;padding:12px calc(12px + var(--sr)) 4px calc(12px + var(--sl))}
.seat{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px 14px 12px 18px;background:linear-gradient(160deg,#131d31,#0c1322);border:1px solid var(--line);border-radius:16px;box-shadow:inset 5px 0 0 var(--pal);overflow:hidden}
.seat::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0 0,var(--pal),transparent 55%);opacity:.14;pointer-events:none}
.seat>*{position:relative}
.seat-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.seat-head h2{margin:0;font-size:1.25rem;letter-spacing:.04em;flex:1;min-width:0}
.era{font-family:Orbitron,monospace;font-size:.78rem;color:var(--mut)}
.fam{font-size:.66rem;letter-spacing:.14em;padding:3px 8px;border:1px solid var(--acc);border-radius:999px;color:var(--acc2)}
.counter{display:flex;align-items:center;gap:12px;padding:8px 10px;background:#0a0d14;border:1px solid #2a2f3d;border-radius:12px}
.led-wrap{display:flex;flex-direction:column;gap:3px}
.led-lbl{font-size:.6rem;letter-spacing:.16em;color:var(--mut)}
.led{font-family:Orbitron,monospace;font-weight:800;font-size:clamp(1.9rem,9vw,2.4rem);color:var(--amber);text-shadow:0 0 12px rgba(255,179,71,.55);letter-spacing:.08em;line-height:1}
.cnt-side{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:.8rem;color:var(--mut)}
.cnt-side b{color:var(--ink)}
.lamp{font-size:.7rem;font-weight:700;letter-spacing:.12em;padding:3px 8px;border-radius:6px}
.lamp.hot{background:#ff4d5e;color:#fff;box-shadow:0 0 10px rgba(255,77,94,.6)}
.lamp.fast{background:#2f9bff;color:#04101f}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:4px 9px;border:1px solid var(--line);border-radius:999px;background:#0b1220}
.chip em{font-style:normal;color:var(--acc2);margin-left:5px;font-weight:700}
.chip.none{color:var(--mut)}
.tip{margin:0;font-size:.86rem;line-height:1.4;color:#c9d6ea}
.seat-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.diff{display:inline-flex;gap:4px}
.diff i{width:12px;height:12px;border-radius:3px;border:1px solid var(--acc);background:transparent}
.diff i.on{background:var(--acc)}
.foot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px calc(18px + var(--sb));font-size:.78rem;color:var(--mut);text-align:center}
.foot a{display:inline-flex;align-items:center;min-height:44px;font-weight:700;letter-spacing:.06em}
/* cabinet */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:calc(6px + var(--st)) calc(10px + var(--sr)) 6px calc(10px + var(--sl));background:linear-gradient(180deg,#0e1a31,#0a1222);border-bottom:2px solid var(--acc)}
.hud-name{flex:1;min-width:0;font-weight:700;font-size:clamp(.95rem,4.4vw,1.2rem);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-bank{text-align:right;min-width:3.2rem}
.hud-bank b{display:block;font-family:Orbitron,monospace;font-size:clamp(1rem,4.6vw,1.25rem);color:var(--amber);line-height:1.1}
.hud-row{display:flex;align-items:center;gap:12px;width:100%;font-size:.78rem;color:var(--mut);letter-spacing:.08em}
.hud-row b{color:var(--ink);font-family:Orbitron,monospace}
.pill{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:999px;font-weight:700;font-size:.78rem;letter-spacing:.12em;background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
.pill.reach{background:#7a4b00;border-color:#ffb347;color:#ffe3b0}
.pill.jp{background:#7d1021;border-color:#ff5a6e;color:#fff}
.pill.kaku{background:#8a2331;border-color:#ff8a98;color:#fff}
.pill.jitan{background:#0d3a6b;border-color:var(--acc2);color:#dcecff}
#stage{position:relative;flex:1;min-height:0;background:#05080e;overflow:hidden;display:flex;flex-direction:column}
#pixi-host{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#controls{position:relative;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px calc(12px + var(--sr)) calc(8px + var(--sb)) calc(12px + var(--sl));background:#070b12;border-top:2px solid var(--acc);z-index:5}
#stream{display:flex;flex-direction:row;gap:6px;flex:1;min-width:0}
#stream button{flex:1;min-width:48px;min-height:48px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-weight:700;letter-spacing:.08em;font-size:.85rem}
#stream button.on{background:var(--acc);border-color:var(--acc2);color:#fff}
#stream button.demand,#stream button.on.demand{background:var(--amber);border-color:#fff;color:#1b1204;animation:pulse .6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,179,71,.9)}to{box-shadow:0 0 0 8px rgba(255,179,71,0)}}
@media (prefers-reduced-motion:reduce){#stream button.demand{animation:none}}
#dial{position:relative;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#26385a,#0a101c 70%);border:2px solid var(--acc);touch-action:none;cursor:grab;flex:none}
#dial svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#dial-track{fill:none;stroke:#26334d;stroke-width:6;stroke-linecap:round}
#dial-val{fill:none;stroke:var(--amber);stroke-width:6;stroke-linecap:round}
#dial-thumb{position:absolute;left:50%;top:50%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dfe8f7,#7e8da6 60%,#39465c);border:2px solid #0a101c;box-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none}
#dial-read{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:Orbitron,monospace;font-weight:800;font-size:.85rem;color:#fff;pointer-events:none;text-shadow:0 1px 3px #000;z-index:2}
#rent-wrap{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(92%,21rem);padding:16px 14px;background:rgba(10,15,25,.95);border:1px solid var(--acc);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.7);text-align:center}
.rent-head{font-size:.68rem;letter-spacing:.18em;color:var(--mut)}
.rent-note{font-size:.76rem;color:var(--mut);line-height:1.35}
#rent-wrap .btn{width:100%}
/* hall economy strip */
.hallbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px calc(10px + var(--sr)) 7px calc(10px + var(--sl));background:#0a1120;border-bottom:1px solid var(--line)}
.hb-stat{display:flex;flex-direction:column;gap:2px;padding-right:6px;min-width:3.6rem}
.hb-stat b{font-family:Orbitron,monospace;font-size:.95rem;line-height:1.1}
.hb-stat b.amber{color:var(--amber)}
.hb-btn{flex:1 1 auto;min-height:44px;padding:0 10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-weight:700;font-size:.78rem;letter-spacing:.06em;white-space:nowrap}
.hb-btn.go{border-color:var(--acc);color:var(--acc2)}
.hb-btn:active{background:var(--acc);color:#fff}
/* counter and case */
.cnt-lead{color:var(--mut)!important;font-size:.86rem!important}
.jet{display:flex;flex-direction:column;align-items:center;gap:4px;margin:10px 0 14px;padding:14px 10px;background:#05080e;border:1px solid var(--line);border-radius:12px}
.jet b{font-family:Orbitron,monospace;font-weight:800;font-size:clamp(2rem,11vw,2.8rem);color:var(--amber);text-shadow:0 0 14px rgba(255,179,71,.5);line-height:1}
.jet.small{margin:4px 0 10px;padding:8px}
.jet.small b{font-size:1.5rem}
.jet.pay b{color:#4de08a;text-shadow:0 0 14px rgba(77,224,138,.5)}
.shelf{display:grid;grid-template-columns:1fr;gap:6px;margin:6px 0}
.prz{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:46px;padding:0 12px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:.88rem;font-weight:700}
.prz[disabled]{opacity:.45;cursor:default}
.prz.have{border-color:#4de08a;opacity:1}
.prz.have .prz-cost{color:#4de08a}
.prz.locked{opacity:.4}
.prz-cost{font-family:Orbitron,monospace;font-size:.72rem;color:var(--mut);white-space:nowrap}
.plaques{display:grid;grid-template-columns:1fr;gap:6px;margin:6px 0}
.plq{padding:8px 12px;background:#0b1220;border:1px solid var(--line);border-left:4px solid #2a3140;border-radius:10px;opacity:.45}
.plq.have{opacity:1;border-left-color:var(--amber)}
.plq b{display:block;font-size:.92rem}
.plq span{font-size:.78rem;color:var(--mut)}
.stat-row{display:flex;gap:8px;margin:8px 0 4px}
.stat-row span{flex:1;display:flex;flex-direction:column;gap:2px;padding:8px;background:#0b1220;border:1px solid var(--line);border-radius:10px;font-size:.6rem;letter-spacing:.14em;color:var(--mut)}
.stat-row b{font-family:Orbitron,monospace;font-size:.86rem;color:var(--ink);letter-spacing:0}
.stat-row b.up{color:#4de08a}
.stat-row b.down{color:#ff8a98}
.walk{display:flex;align-items:center;gap:6px;margin:4px 0 12px}
.w-step{flex:1;text-align:center;font-size:.68rem;letter-spacing:.08em;padding:7px 2px;border:1px solid var(--line);border-radius:8px;color:var(--mut)}
.w-step.on{border-color:var(--acc);color:var(--acc2)}
.w-dash{width:10px;height:2px;background:var(--line);flex:none}
.cnt-row{display:flex;flex-direction:column}
#toast{position:absolute;left:50%;top:calc(10px + var(--st));transform:translate(-50%,-140%);z-index:70;width:min(92vw,22rem);padding:10px 14px;background:linear-gradient(160deg,#1d2740,#121a2b);border:1px solid var(--amber);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.6);transition:transform .35s ease;pointer-events:none}
#toast.show{transform:translate(-50%,0)}
#toast .t-lbl{display:block;font-size:.58rem;letter-spacing:.2em;color:var(--amber)}
#toast b{display:block;font-size:1rem;letter-spacing:.03em}
#toast .t-note{display:block;font-size:.75rem;color:var(--mut)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* overlays */
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,6,12,.78);z-index:50;padding:calc(12px + var(--st)) 12px calc(12px + var(--sb))}
.overlay.open{display:flex}
.sheet{width:min(94vw,30rem);max-height:88svh;overflow-y:auto;background:var(--panel);border:1px solid var(--acc);border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.sheet h2{margin:0 0 10px;font-size:1.3rem;letter-spacing:.05em}
.sheet h2 small{font-family:Orbitron,monospace;font-size:.7rem;color:var(--mut);margin-left:6px}
.sheet h3{margin:14px 0 4px;font-size:.78rem;letter-spacing:.16em;color:var(--acc2)}
.sheet p{margin:0 0 6px;line-height:1.5;font-size:.92rem;color:#d3dff0}
.sheet .fine{font-size:.76rem;color:var(--mut)}
.sheet .btn{margin-top:12px;width:100%}
.row-btn{display:block;width:100%;min-height:48px;margin:8px 0;padding:0 14px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;font-weight:700;font-size:.95rem}
.row-btn[aria-pressed="true"]{border-color:var(--acc2)}
.row-btn.danger{border-color:#7d1021;color:#ffb3bd}
.row-btn.danger.armed{background:#7d1021;color:#fff}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#cdn-error{z-index:100;background:var(--bg)}
</style>
</head>
<body>
<div id="shell">
  <section id="hall" class="screen active" aria-label="Pachinko hall">
    <header class="bar">
      <a class="portal" href="https://augustineiacopelli.github.io/appaday/" aria-label="AppADay portfolio">AppADay</a>
      <div class="title"><h1>Pachinko Hall</h1><span class="sub">APPADAY 187</span></div>
      <button id="gear-hall" class="icon-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button>
    </header>
    <div class="hallbar">
      <span class="hb-stat"><span class="lbl">WALLET</span><b id="wallet-hall">0</b></span>
      <span class="hb-stat"><span class="lbl">TRAY</span><b id="tray-hall" class="amber">0</b></span>
      <button type="button" id="rate-btn" class="hb-btn">4 YEN</button>
      <button type="button" id="counter-btn" class="hb-btn go">Counter</button>
      <button type="button" id="case-btn" class="hb-btn">Case</button>
    </div>
    <div class="scroll">
      <div id="seat-grid"></div>
      <footer class="foot">
        <a href="https://augustineiacopelli.github.io/appaday/">AppADay portfolio</a>
        <span>AppADay 187 | Play balls only, no money.</span>
      </footer>
    </div>
  </section>
  <section id="cabinet" class="screen" aria-label="Pachinko cabinet">
    <div id="hud">
      <button id="btn-back" class="icon-btn" aria-label="Back to the hall"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div id="hud-name" class="hud-name"></div>
      <div class="hud-bank"><span class="lbl">TRAY</span><b id="hud-bank">0</b></div>
      <button id="btn-help" class="icon-btn" aria-label="Help for this cabinet"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.5-1.1 1-1.1 1.8M12 17h.01"/></svg></button>
      <button id="btn-gear" class="icon-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button>
      <div class="hud-row"><span id="hud-mode" class="pill normal">NORMAL</span><span>SPINS <b id="hud-spins">0</b></span><span>SINCE <b id="hud-since">0</b></span></div>
    </div>
    <div id="stage">
      <div id="pixi-host"></div>
      <div id="rent-wrap" hidden>
        <span class="rent-head">The tray is empty</span>
        <button type="button" id="rent-btn" class="btn">Insert 1,000</button>
        <span id="rent-note" class="rent-note"></span>
      </div>
      <div id="controls">
        <div id="stream" role="group" aria-label="Launch stream">
          <button type="button" data-stream="L" class="on" aria-pressed="true" aria-label="Left stream">LEFT</button>
          <button type="button" data-stream="R" aria-pressed="false" aria-label="Right stream">RIGHT</button>
        </div>
        <div id="dial" role="slider" tabindex="0" aria-label="Launch power, hold to fire" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35">
          <svg viewBox="0 0 100 100" aria-hidden="true"><path id="dial-track" d=""/><path id="dial-val" d=""/></svg>
          <div id="dial-thumb"></div>
          <div id="dial-read">35</div>
        </div>
      </div>
    </div>
  </section>
  <div id="settings-modal" class="overlay" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <div class="sheet">
      <h2 id="set-title">Settings</h2>
      <button type="button" id="set-sound" class="row-btn" aria-pressed="true">Sound: On</button>
      <button type="button" id="set-reduced" class="row-btn" aria-pressed="false">Reduced effects: Off</button>
      <button type="button" id="set-reset" class="row-btn danger">Reset balls and histories</button>
      <button type="button" id="set-close" class="btn">Done</button>
    </div>
  </div>
  <div id="help-sheet" class="overlay" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="sheet" id="help-body"></div>
  </div>
  <div id="counter-sheet" class="overlay" role="dialog" aria-modal="true" aria-labelledby="cnt-title">
    <div class="sheet">
      <h2 id="cnt-title">Ball counter</h2>
      <div id="cnt-body"></div>
    </div>
  </div>
  <div id="case-sheet" class="overlay" role="dialog" aria-modal="true" aria-labelledby="case-title">
    <div class="sheet" id="case-body"></div>
  </div>
  <div id="toast" aria-hidden="true"></div>
  <div id="cdn-error" class="overlay" role="alertdialog" aria-modal="true">
    <div class="sheet"><h2>The renderer did not load</h2><p>PixiJS could not be fetched. Check your connection and reload the page.</p></div>
  </div>
  <div id="live" aria-live="polite"></div>
</div>
<script>
/* ===== SECTION 1: CONSTANTS ===== */
'use strict';

/* vector helpers */
function vlen(x, y) { return Math.sqrt(x * x + y * y); }

  var ax = s[0], ay = s[1], bx = s[2] - ax, by = s[3] - ay, l2 = bx * bx + by * by;
  var t = l2 > 0 ? ((px - ax) * bx + (py - ay) * by) / l2 : 0;

  return vlen(px - (ax + bx * t), py - (ay + by * t));
}

  var L = 0;
  for (var i = 1; i < path.length; i++) L += vlen(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]);
  return L;
}

    s[0].x1 = lerp(x - 14, x - 20, t); s[0].y1 = lerp(y, y - 14, t);
    s[0].x2 = lerp(x - 2, x - 6, t); s[0].y2 = lerp(y - 12, y, t);
    s[1].x1 = 2 * x - s[0].x1; s[1].y1 = s[0].y1; s[1].x2 = 2 * x - s[0].x2; s[1].y2 = s[0].y2;

    var th = lerp(closedDeg, openDeg, t) * Math.PI / 180;

    s[0].x1 = cx - dx; s[0].y1 = py; s[0].x2 = tipx; s[0].y2 = tipy;
    s[1].x1 = cx + dx; s[1].y1 = py; s[1].x2 = 2 * cx - tipx; s[1].y2 = tipy;
  };

  var s = cab.senpuku;

    res.rounds = cab.payout.rounds;
    res.next = out.u[5] < cab.odds.kakuRate ? 'kakuhen' : 'jitan';
  }
}
function routeBattle(cab, out, res) {

    m.kstep++;

    if (m.kstep >= 3) { m.kstep = 0; m.kenri = true; m.emit('kenri'); }
  } else {
    m.kstep = (s.idx === 0) ? 1 : 0;
    m.emit('gate', {idx: s.idx, step: m.kstep, ok: false});
  }
  m.persist();
}

      g.circle(x - s * 0.22, y + s * 0.28, s * 0.22).fill(c); g.circle(x + s * 0.24, y + s * 0.22, s * 0.22).fill(c);

      break;
    case 'star': g.poly(starPts(x, y, s * 0.52)).fill(c); break;
    case 'diamond': g.poly([x, y - s * 0.52, x + s * 0.38, y, x, y + s * 0.52, x - s * 0.38, y]).fill(c); break;
    case 'clover':

}
function renderDial() {

  if (typeof VIEW !== 'undefined' && VIEW) VIEW.aim.power = IN.power;
}
function setPower(p) { IN.power = clamp(p, 0, 1); renderDial(); }
function setStream(s) {
  IN.stream = s;
  var bs = document.querySelectorAll('#stream button');
  for (var i = 0; i < bs.length; i++) {
    var on = bs[i].getAttribute('data-stream') === s;
    bs[i].classList.toggle('on', on);
    bs[i].setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  if (VIEW) VIEW.aim.stream = s;
}
function powerFromEvent(e) {
  var r = document.getElementById('dial').getBoundingClientRect();
  var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return IN.power;
  var ang = Math.atan2(dx, -dy) * 180 / Math.PI;
  if (ang < -135) return 0;
  if (ang > 135) return 1;
  return (ang + 135) / 270;
}
function launching() { return IN.dialHeld || IN.stageHeld || IN.keyHeld; }
function releaseAll() { IN.dialHeld = false; IN.stageHeld = false; IN.keyHeld = false; }
function tryLaunch() {
  if (!WORLD || !MACH) return;
  if (STATE.tray <= 0) { syncHud(true); return; }
  if (WORLD.active() >= MAX_BALLS) return;
  var b = WORLD.launch(IN.stream, IN.power, jitterStream);
  if (b) {
    STATE.tray--; IN.cd = PHYS.LAUNCH_CD;
    Sfx.launch(); markDirty();
  }
}
function bindInput() {
  var dial = document.getElementById('dial'), host = document.getElementById('pixi-host');
  document.addEventListener('pointerdown', function () { Sfx.unlock(); }, {passive: true});
  dial.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    IN.dialHeld = true; IN.pid = e.pointerId;
    try { dial.setPointerCapture(e.pointerId); } catch (x) {}
    setPower(powerFromEvent(e));
  }, {passive: false});
  dial.addEventListener('pointermove', function (e) {
    if (!IN.dialHeld || e.pointerId !== IN.pid) return;
    e.preventDefault();
    setPower(powerFromEvent(e));
  }, {passive: false});
  var endDial = function (e) { if (e.pointerId === IN.pid) { IN.dialHeld = false; IN.pid = null; } };
  dial.addEventListener('pointerup', endDial, {passive: true});
  dial.addEventListener('pointercancel', endDial, {passive: true});
  host.addEventListener('pointerdown', function (e) {
    e.preventDefault(); IN.stageHeld = true;
    try { host.setPointerCapture(e.pointerId); } catch (x) {}
  }, {passive: false});
  var endStage = function () { IN.stageHeld = false; };
  host.addEventListener('pointerup', endStage, {passive: true});
  host.addEventListener('pointercancel', endStage, {passive: true});
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', function () { if (document.hidden) releaseAll(); });
  var sb = document.querySelectorAll('#stream button');
  for (var i = 0; i < sb.length; i++) {
    sb[i].addEventListener('click', function (e) { setStream(e.currentTarget.getAttribute('data-stream')); });
  }
  dial.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setPower(IN.power - 0.04); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setPower(IN.power + 0.04); }
  });
  document.addEventListener('keydown', function (e) {
    if (UI.screen !== 'cabinet' || UI.overlay) return;
    var tag = e.target && e.target.tagName;
    if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); IN.keyHeld = true; Sfx.unlock(); }
    else if (e.key === 'l' || e.key === 'L') setStream('L');
    else if (e.key === 'r' || e.key === 'R') setStream('R');
    else if (e.key === 'ArrowLeft' && tag !== 'DIV') setPower(IN.power - 0.04);
    else if (e.key === 'ArrowRight' && tag !== 'DIV') setPower(IN.power + 0.04);
  });
  document.addEventListener('keyup', function (e) { if (e.key === ' ') IN.keyHeld = false; });
  document.getElementById('dial-track').setAttribute('d', arcPath(50, 50, 40, -135, 135));
  renderDial();
  setStream('L');
}

/* ===== SECTION 11: UI ===== */
var STATE = null, APPX = null, VIEW = null, WORLD = null, MACH = null, CAB = null;
var UI = {screen: 'hall', overlay: null, dirty: false, acc: 0, hudT: 0, resetT: 0, resetArmed: false,
  liveT: 0, hits: 0, toastT: 0, cnt: null};

function $(id) { return document.getElementById(id); }
function pad3(n) { n = String(Math.min(n, 999)); while (n.length < 3) n = '0' + n; return n; }
function grp(n) {
  n = String(Math.max(0, Math.floor(n)));
  for (var i = n.length - 3; i > 0; i -= 3) n = n.slice(0, i) + ',' + n.slice(i);
  return n;
}
function yen(n) { return String.fromCharCode(165) + grp(n); }
function markDirty() { UI.dirty = true; }
function flushSave() {
  if (!STATE) return;
  if (MACH) MACH.persist();
  saveState(STATE); UI.dirty = false;
}
function announce(msg) { var l = $('live'); if (l) l.textContent = msg; }

/* ---- plaques ---- */
function plaqueById(id) {
  for (var i = 0; i < PLAQUES.length; i++) if (PLAQUES[i].id === id) return PLAQUES[i];
  return null;
}
function award(id) {
  if (!STATE || STATE.plaques.indexOf(id) >= 0) return false;
  var p = plaqueById(id);
  if (!p) return false;
  STATE.plaques.push(id); markDirty();
  var t = $('toast');
  t.innerHTML = '<span class="t-lbl">PLAQUE EARNED</span><b>' + p.name + '</b><span class="t-note">' + p.note + '</span>';
  t.classList.add('show');
  UI.toastT = 3.4;
  Sfx.stinger();
  announce('Plaque earned. ' + p.name + '.');
  return true;
}
function checkStanding() {
  if (!STATE) return;
  if (STATE.tray >= 2000) award('heavy');
  if (STATE.prizes.length >= 6) award('collector');
  if (STATE.prizes.indexOf('bar') >= 0) award('whale');
  if (STATE.seen.length >= CABS.length) award('tour');
}
function tickToast(dt) {
  if (UI.toastT <= 0) return;
  UI.toastT -= dt;
  if (UI.toastT <= 0) $('toast').classList.remove('show');
}

/* ---- the economy ---- */
function perBill() { return Math.floor(ECON.bill / STATE.rate); }
function rent() {
  if (STATE.wallet < ECON.bill) return false;
  STATE.wallet -= ECON.bill;
  STATE.tray += perBill();
  STATE.spent += ECON.bill;
  markDirty();
  Sfx.pocket();
  announce('Rented ' + perBill() + ' balls for ' + yen(ECON.bill) + '.');
  return true;
}
function stakeMe() {
  STATE.wallet += ECON.lend; markDirty();
  announce('The hall stakes you ' + yen(ECON.lend) + '.');
}
function specialsIn(balls) { return Math.floor(balls / ECON.specialBalls); }
function specialValue() { return Math.round(ECON.specialYen * STATE.rate / 4); }

/* ---- hall ---- */
var FAMILY_TAG = {tulip: 'TULIP', wing: 'WING', digi: 'DIGI'};
function familyLabel(cab) {
  if (cab.variant === 'senpuku') return 'DIGI HIDDEN';
  if (cab.variant === 'battle') return 'DIGI DUEL';
  if (cab.variant === 'kenri') return 'DIGI GATES';
  if (cab.variant === 'smart') return 'SMART';
  return FAMILY_TAG[cab.family];
}
function seatHtml(cab, rec) {
  var pal = PALETTES[cab.palette], i, chips = '', stars = '';
  for (i = 0; i < Math.min(6, rec.history.length); i++) chips += '<span class="chip">' + rec.history[i].s + '<em>' + rec.history[i].r + 'R</em></span>';
  if (!chips) chips = '<span class="chip none">no hits logged</span>';
  for (i = 0; i < 5; i++) stars += '<i' + (i < cab.difficulty ? ' class="on"' : '') + '></i>';
  var lamp = '';
  if (rec.mode === 'kakuhen') lamp = '<span class="lamp hot">HOT</span>';
  else if (rec.mode === 'jitan') lamp = '<span class="lamp fast">FAST ' + rec.jl + '</span>';
  return '<article class="seat" style="--pal:' + hex6(pal.glow) + ';--pal2:' + hex6(pal.plate) + '">' +
    '<div class="seat-head"><span class="era">' + cab.era + '</span><h2>' + cab.name + '</h2><span class="fam">' + familyLabel(cab) + '</span></div>' +
    '<div class="counter" aria-label="Data counter">' +
      '<div class="led-wrap"><span class="led-lbl">SINCE HIT</span><b class="led">' + pad3(rec.since) + '</b></div>' +
      '<div class="cnt-side"><span class="cnt-line">SPINS <b>' + rec.spins + '</b></span>' + lamp + '</div>' +
    '</div>' +
    '<div class="chips" aria-label="Recent hits, spins before each hit and rounds">' + chips + '</div>' +
    '<p class="tip">' + cab.tip + '</p>' +
    '<div class="seat-foot"><span class="diff" role="img" aria-label="Difficulty ' + cab.difficulty + ' of 5">' + stars + '</span>' +
    '<button class="btn sit" data-sit="' + cab.id + '">Sit down</button></div></article>';
}
function renderSeatCards() {
  var h = '';
  for (var i = 0; i < CABS.length; i++) h += seatHtml(CABS[i], STATE.cabs[CABS[i].id]);
  $('seat-grid').innerHTML = h;
  syncHall();
}
function syncHall() {
  $('wallet-hall').textContent = yen(STATE.wallet);
  $('tray-hall').textContent = grp(STATE.tray);
  $('rate-btn').textContent = STATE.rate + ' YEN';
  $('rate-btn').setAttribute('aria-label', 'Island rate, ' + STATE.rate + ' yen per ball. Tap to switch.');
  var n = specialsIn(STATE.tray);
  $('counter-btn').textContent = n > 0 ? 'Counter (' + n + ')' : 'Counter';
}
function setScreen(name) {
  UI.screen = name;
  $('hall').classList.toggle('active', name === 'hall');
  $('cabinet').classList.toggle('active', name === 'cabinet');
  if (APPX) { if (name === 'cabinet') APPX.ticker.start(); else APPX.ticker.stop(); }
}
function showHall() {
  releaseAll();
  setScreen('hall');
  renderSeatCards();
}

/* ---- cabinet ---- */
function machineEvent(type, d) {
  if (type === 'persist') { markDirty(); return; }
  var v = VIEW;
  if (type === 'pay') {
    STATE.tray += d.n; markDirty();
    if (v && d.x) { v.popup(d.x, d.y, d.n, d.why === 'round' ? v.pal.hot : 0xffffff); v.cascade(d.x, d.y, d.n); }
    if (d.why === 'start' || d.why === 'round' || d.why === 'catch') Sfx.pocket();
  } else if (type === 'sensor') {
    if (d.kind === 'start') award('firstspin');
    if (v && (d.kind === 'start' || d.kind === 'pocket' || d.kind === 'catch')) {
      v.burst(d.x, d.y, v.pal.hot, d.kind === 'start' ? 10 : 6, 150);
      if (d.kind === 'start') v.startFlash = 1;
    }
  } else if (type === 'reach') {
    Sfx.reach(); announce(d === 2 ? 'Super reach' : 'Reach');
  } else if (type === 'jackpot') {
    Sfx.stinger(); if (v) { v.showBanner('JACKPOT'); v.flashAmt = 1; v.shake = 2; }
    award('firsthit');
    UI.hits++; if (UI.hits >= 3) award('streak');
    announce('Jackpot. ' + d.rounds + ' rounds.');
  } else if (type === 'round') {
    Sfx.cascade();
    if (v) v.showBanner('ROUND ' + d);
    announce('Round ' + d + (CAB.payout.aim === 'right' ? '. Shoot right.' : '.'));
  } else if (type === 'duel') {
    Sfx.thud(); announce('Duel');
  } else if (type === 'jackpotEnd') {
    var t = d === 'kakuhen' ? 'KAKUHEN' : (d === 'jitan' ? 'JITAN' : '');
    if (t && v) { v.showBanner(t); v.flashAmt = 0.7; }
    if (d === 'kakuhen') { award('kakuhen'); if (CAB.variant === 'battle') award('duel'); }
    if (d === 'hidden') award('hidden');
    announce(d === 'kakuhen' ? 'Kakuhen. High odds.' : (d === 'jitan' ? 'Jitan. Fast spins.' : 'Jackpot over.'));
    flushSave();
  } else if (type === 'kenri') {
    Sfx.stinger(); if (v) { v.showBanner('KENRI'); v.flashAmt = 0.6; }
    award('gates');
    announce('Kenri earned. The next spin is likely a hit.');
  } else if (type === 'gate') {
    if (!d.ok) Sfx.thud();
  }
}
function showCabinet(id) {
  var cab = cabById(id);
  if (!cab || !APPX) return;
  CAB = cab;
  if (STATE.seen.indexOf(id) < 0) { STATE.seen.push(id); markDirty(); }
  UI.hits = 0;
  WORLD = new World(cab);
  MACH = createMachine(cab, STATE.cabs[id], WORLD);
  MACH.listener = machineEvent;
  WORLD.onPin = function (x, y, spd) { Sfx.pin(spd); if (VIEW) VIEW.pinSpark(x, y, spd); };
  if (VIEW) { VIEW.destroy(); VIEW = null; }
  VIEW = new RView(APPX, cab, WORLD, MACH, STATE.settings);
  VIEW.aim.stream = IN.stream; VIEW.aim.power = IN.power;
  $('hud-name').textContent = cab.name;
  $('cabinet').style.setProperty('--pal', hex6(PALETTES[cab.palette].glow));
  UI.acc = 0; UI.hudT = 0; IN.cd = 0;
  setScreen('cabinet');
  resizeStage();
  syncHud(true);
  checkStanding();
  announce(cab.name + '. ' + cab.tip);
}
function leaveCabinet() {
  releaseAll();
  if (MACH) { MACH.flush(); MACH.listener = null; }
  flushSave();
  if (WORLD) WORLD.clear();
  showHall();
}
function resizeStage() {
  if (!APPX || !VIEW) return;
  var host = $('pixi-host'), w = host.clientWidth, h = host.clientHeight;
  if (w < 10 || h < 10) return;
  APPX.renderer.resize(w, h);
  VIEW.layout(w, h);
}
function syncHud(force) {
  if (!MACH) return;
  $('hud-bank').textContent = grp(STATE.tray);
  if (VIEW) VIEW.trayCount = STATE.tray;
  var lb = MACH.label(), pill = $('hud-mode');
  if (pill.textContent !== lb.text) pill.textContent = lb.text;
  pill.className = 'pill ' + lb.cls;
  $('hud-spins').textContent = MACH.rec.spins;
  $('hud-since').textContent = MACH.rec.since;
  /* the attacker only takes right stream shots, so the RIGHT button itself warns */
  var dem = MACH.aimDemand() && IN.stream !== 'R', rb = $('stream').querySelector('[data-stream="R"]');
  rb.classList.toggle('demand', dem);
  rb.setAttribute('aria-label', dem ? 'Right stream, needed now for the attacker' : 'Right stream');
  if (MACH.rec.since >= 250) award('patience');
  if (STATE.tray >= 2000) award('heavy');
  var dry = STATE.tray <= 0 && WORLD.active() === 0;
  $('rent-wrap').hidden = !dry;
  if (dry) {
    var can = STATE.wallet >= ECON.bill;
    $('rent-btn').textContent = can ? ('Insert ' + yen(ECON.bill) + ' for ' + perBill() + ' balls') : ('Wallet empty. Take ' + yen(ECON.lend));
    $('rent-note').textContent = can ? ('Wallet ' + yen(STATE.wallet) + ' at ' + STATE.rate + ' yen a ball') : 'The hall will stake you.';
  }
}
function frame(tk) {
  if (UI.screen !== 'cabinet' || !MACH || !VIEW) return;
  var dt = Math.min(tk.deltaMS / 1000, 0.1);
  Sfx.frame();
  IN.cd -= dt;
  if (launching() && IN.cd <= 0 && !UI.overlay) tryLaunch();
  UI.acc += dt;
  var n = 0;
  while (UI.acc >= PHYS.DT && n < 8) { WORLD.step(PHYS.DT); UI.acc -= PHYS.DT; n++; }
  if (n >= 8) UI.acc = 0;
  MACH.update(dt);
  VIEW.update(dt);
  tickToast(dt);
  var sp = MACH.spin;
  if (sp && sp.res.slip && sp.t >= sp.plan.end) award('slip');
  UI.hudT -= dt;
  if (UI.hudT <= 0) { syncHud(); UI.hudT = 0.12; }
}

/* ---- overlays ---- */
var OVERLAYS = ['settings-modal', 'help-sheet', 'counter-sheet', 'case-sheet'];
function openOverlay(id) {
  releaseAll();
  closeOverlays(true);
  $(id).classList.add('open');
  UI.overlay = id;
  var f = $(id).querySelector('button');
  if (f) f.focus();
}
function closeOverlays(keep) {
  for (var i = 0; i < OVERLAYS.length; i++) $(OVERLAYS[i]).classList.toggle('open', false);
  if (!keep) UI.overlay = null;
  if (UI.cnt) { clearInterval(UI.cnt); UI.cnt = null; }
}

/* ---- the counter, the prize shelf and the window round the corner ---- */
function prizeById(id) {
  for (var i = 0; i < PRIZES.length; i++) if (PRIZES[i].id === id) return PRIZES[i];
  return null;
}
function prizeRow(p) {
  var have = STATE.prizes.indexOf(p.id) >= 0, can = STATE.tray >= p.cost;
  return '<button type="button" class="prz' + (have ? ' have' : '') + '" data-prize="' + p.id + '"' +
    (have || !can ? ' disabled' : '') + '>' +
    '<span class="prz-name">' + p.name + '</span>' +
    '<span class="prz-cost">' + (have ? 'ON THE SHELF' : grp(p.cost) + ' balls') + '</span></button>';
}
function counterStage(stage, data) {
  var el = $('cnt-body'), h = '', i;
  if (UI.cnt) { clearInterval(UI.cnt); UI.cnt = null; }
  if (stage === 'tally') {
    h = '<p class="cnt-lead">The tray goes into the counter.</p>' +
        '<div class="jet"><span class="lbl">COUNTED</span><b id="jet-num">0</b></div>';
    el.innerHTML = h;
    var target = STATE.tray, shown = 0, step = Math.max(1, Math.ceil(target / 36));
    UI.cnt = setInterval(function () {
      shown = Math.min(target, shown + step);
      var jn = $('jet-num');
      if (jn) jn.textContent = grp(shown);
      if (shown >= target) { clearInterval(UI.cnt); UI.cnt = null; setTimeout(function () { if (UI.overlay === 'counter-sheet') counterStage('shelf'); }, 420); }
    }, 34);
    return;
  }
  if (stage === 'shelf') {
    var sp = specialsIn(STATE.tray), val = sp * specialValue();
    h += '<div class="jet small"><span class="lbl">IN THE TRAY</span><b>' + grp(STATE.tray) + '</b></div>';
    h += '<h3>Special prize</h3>';
    if (sp > 0) {
      h += '<p>' + sp + ' gold sliver' + (sp === 1 ? '' : 's') + ' in a plastic case, ' + grp(ECON.specialBalls) + ' balls each. ' +
           'The hall cannot pay you cash, but the window round the corner buys them for ' + yen(val) + '.</p>';
      h += '<button type="button" class="btn" id="cnt-special">Take ' + sp + ' and walk round</button>';
    } else {
      h += '<p>You need ' + grp(ECON.specialBalls) + ' balls for one. You have ' + grp(STATE.tray) + '.</p>';
    }
    h += '<h3>The shelf</h3><div class="shelf">';
    for (i = 0; i < PRIZES.length; i++) h += prizeRow(PRIZES[i]);
    h += '</div>';
    h += '<h3>Member card</h3><p>Leftover balls can sit on the card until your next visit. Stored: ' + grp(STATE.stored) + '.</p>';
    h += '<div class="cnt-row">';
    if (STATE.tray > 0) h += '<button type="button" class="row-btn" id="cnt-store">Store ' + grp(STATE.tray) + ' on the card</button>';
    if (STATE.stored > 0) h += '<button type="button" class="row-btn" id="cnt-draw">Draw ' + grp(STATE.stored) + ' back out</button>';
    h += '</div>';
    h += '<button type="button" class="btn" id="cnt-close">Back to the floor</button>';
    el.innerHTML = h;
    return;
  }
  if (stage === 'walk') {
    h = '<div class="walk" aria-hidden="true"><span class="w-step on">Counter</span><span class="w-dash"></span>' +
        '<span class="w-step on">Prize desk</span><span class="w-dash"></span><span class="w-step on">The window</span></div>' +
        '<p class="cnt-lead">Three doors, three businesses, no gambling anywhere in sight.</p>' +
        '<div class="jet pay"><span class="lbl">PAID OUT</span><b>' + yen(data.yen) + '</b></div>' +
        '<p>' + data.n + ' special prize' + (data.n === 1 ? '' : 's') + ' handed over. ' +
        'They go back to the hall by van tomorrow and someone else wins them.</p>' +
        (STATE.tray > 0 || STATE.stored > 0 ? '<button type="button" class="row-btn" id="cnt-back">Back to the shelf (' + grp(STATE.tray) + ' balls left)</button>' : '') +
        '<button type="button" class="btn" id="cnt-close">Back to the floor</button>';
    el.innerHTML = h;
  }
}
function openCounter() {
  openOverlay('counter-sheet');
  counterStage('tally');
}
function doSpecial() {
  var n = specialsIn(STATE.tray);
  if (n <= 0) return;
  var got = n * specialValue();
  STATE.tray -= n * ECON.specialBalls;
  STATE.wallet += got;
  STATE.cashed += got;
  if (got > STATE.best) STATE.best = got;
  markDirty(); flushSave();
  award('cashout');
  Sfx.cascade();
  announce('Exchanged ' + n + ' special prizes for ' + yen(got) + '.');
  counterStage('walk', {n: n, yen: got});
}
function claimPrize(id) {
  var p = prizeById(id);
  if (!p || STATE.prizes.indexOf(id) >= 0 || STATE.tray < p.cost) return;
  STATE.tray -= p.cost;
  STATE.prizes.push(id);
  markDirty(); flushSave();
  Sfx.pocket();
  announce(p.name + ' claimed.');
  checkStanding();
  counterStage('shelf');
}
function buildCase() {
  var h = '', i, p, have;
  h += '<h2 id="case-title">The case by the door</h2>';
  h += '<div class="stat-row"><span>SPENT<b>' + yen(STATE.spent) + '</b></span><span>CASHED<b>' + yen(STATE.cashed) + '</b></span>' +
       '<span>NET<b class="' + (STATE.cashed - STATE.spent >= 0 ? 'up' : 'down') + '">' +
       (STATE.cashed - STATE.spent >= 0 ? '+' : '-') + yen(Math.abs(STATE.cashed - STATE.spent)) + '</b></span></div>';
  h += '<h3>Prizes taken home (' + STATE.prizes.length + ' of ' + PRIZES.length + ')</h3><div class="shelf show">';
  for (i = 0; i < PRIZES.length; i++) {
    p = PRIZES[i]; have = STATE.prizes.indexOf(p.id) >= 0;
    h += '<div class="prz' + (have ? ' have' : ' locked') + '"><span class="prz-name">' + (have ? p.name : 'Not yet claimed') +
         '</span><span class="prz-cost">' + grp(p.cost) + ' balls</span></div>';
  }
  h += '</div>';
  h += '<h3>Plaques (' + STATE.plaques.length + ' of ' + PLAQUES.length + ')</h3><div class="plaques">';
  for (i = 0; i < PLAQUES.length; i++) {
    p = PLAQUES[i]; have = STATE.plaques.indexOf(p.id) >= 0;
    h += '<div class="plq' + (have ? ' have' : '') + '"><b>' + (have ? p.name : 'Locked') + '</b><span>' + p.note + '</span></div>';
  }

  h += '<button type="button" class="btn" id="case-close">Done</button>';
  $('case-body').innerHTML = h;
  $('case-close').addEventListener('click', function () { closeOverlays(); });
}
function oneIn(x) { return x > 0 ? '1 in ' + Math.round(1 / x) : 'none'; }
function buildHelp() {
  var c = CAB || CABS[0], o = c.odds, p = c.payout, h = '';
  h += '<h2 id="help-title">' + c.name + ' <small>' + c.era + '</small></h2>';
  h += '<p>' + c.blurb + '</p>';
  h += '<h3>Playing</h3><p>Hold the dial, or press and hold the stage, to keep firing. Turn the dial to set launch power, and pick the left or right stream. ' +
       'The marker above the pins shows where your shot lands. Each shot costs one ball from the tray and the start pocket pays ' + p.startPay + '.</p>';
  h += '<h3>Odds per spin</h3><p>Base ' + oneIn(o.base) + '.';
  if (o.kaku !== o.base) h += ' Kakuhen ' + oneIn(o.kaku) + ', lasting until the next hit.';
  if (c.odds.kakuRate > 0 && c.variant !== 'battle') h += ' After a hit, ' + Math.round(o.kakuRate * 100) + ' percent go to kakuhen and the rest to jitan.';
  if (c.odds.kakuRate > 0) h += ' Jitan gives ' + PHYS.JITAN_SPINS + ' fast spins at base odds.';
  if (o.reach > 0) h += ' About ' + Math.round(o.reach * 100) + ' percent of misses reach, and some are super reach.';
  h += '</p>';
  if (o.reach > 0) {
    h += '<h3>Reading the reach</h3><p>A cyan frame is an ordinary reach. A red frame and a CHANCE cut in mean super reach, which is rarer and far more often a hit. ' +
         'When the last reel stops dead on the matching symbol and holds, it has not decided yet: it either slips one place past you or slides home.</p>';
  }
  h += '<h3>Jackpot</h3><p>' + p.rounds + ' rounds of up to ' + p.balls + ' balls, ' + p.perBall + ' each.' +
       (p.aim === 'right' ? ' The attacker only catches right stream shots, so tap RIGHT while it pulses amber.' : ' Any stream works while the feature is open.') + '</p>';
  if (c.variant === 'senpuku') h += '<h3>Hidden mode</h3><p>About ' + Math.round(c.senpuku.p2R * 100) + ' percent of hits are a short 2R. Roughly half of those secretly switch on high odds for ' + 100 + ' spins. The machine looks normal, so read the history.</p>';
  if (c.variant === 'battle') h += '<h3>Duel</h3><p>After the rounds the LCD runs a duel. Win and you get kakuhen. Lose and you get jitan.</p>';
  if (c.variant === 'kenri') h += '<h3>Gates</h3><p>Pass the three gates in order, 1 then 2 then 3. A wrong gate resets the chain, and gate 1 starts it again. Completing it gives the right to a very likely hit on the next spin.</p>';
  if (c.variant === 'smart') h += '<h3>No tray</h3><p>A smart cabinet pays nothing into your hands. Balls still rattle inside, but the unit simply counts, which is why hits are rare and the rush runs long.</p>';
  if (c.family === 'tulip') h += '<h3>Tulips</h3><p>A ball in the bell pocket opens every tulip for two seconds. A jackpot holds them open.</p>';
  if (c.family === 'wing') h += '<h3>Wings</h3><p>The wings clap on a steady beat. A jackpot latches them open and every ball in the pocket pays.</p>';
  h += '<h3>The money</h3><p>Balls are rented, never bought, and they belong to the hall. At ' + STATE.rate + ' yen a ball a ' + yen(ECON.bill) +
       ' note buys ' + perBill() + '. Take the tray to the counter when you leave: ' + grp(ECON.specialBalls) + ' balls make one special prize worth ' + yen(specialValue()) +
       ' at the window round the corner, which is less than they cost to rent. That gap is the hall.</p>';
  h += '<h3>Reading tip</h3><p>' + c.tip + '</p>';
  h += '<p class="fine">Leaving the seat settles any spins still waiting. Play balls only, no real money.</p>';
  h += '<button class="btn" id="help-close">Got it</button>';
  $('help-body').innerHTML = h;
  $('help-close').addEventListener('click', function () { closeOverlays(); });
}
function syncSettingsUi() {
  $('set-sound').textContent = 'Sound: ' + (STATE.settings.sound ? 'On' : 'Off');
  $('set-sound').setAttribute('aria-pressed', STATE.settings.sound ? 'true' : 'false');
  $('set-reduced').textContent = 'Reduced effects: ' + (STATE.settings.reduced ? 'On' : 'Off');
  $('set-reduced').setAttribute('aria-pressed', STATE.settings.reduced ? 'true' : 'false');
  $('set-reset').textContent = UI.resetArmed ? 'Tap again to confirm' : 'Reset the whole visit';
  $('set-reset').classList.toggle('armed', UI.resetArmed);
}
function doReset() {
  var keep = STATE.settings;
  STATE = defaultState();
  STATE.settings = keep;
  saveState(STATE);
  UI.resetArmed = false;
  syncSettingsUi();
  closeOverlays();
  if (UI.screen === 'cabinet') { if (WORLD) WORLD.clear(); MACH = null; showHall(); }
  else renderSeatCards();
  announce('Wallet, tray, prizes and histories reset.');
}
function bindUi() {
  $('seat-grid').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button[data-sit]') : null;
    if (b) { Sfx.unlock(); showCabinet(b.getAttribute('data-sit')); }
  });
  $('btn-back').addEventListener('click', leaveCabinet);
  $('gear-hall').addEventListener('click', function () { syncSettingsUi(); openOverlay('settings-modal'); });
  $('btn-gear').addEventListener('click', function () { syncSettingsUi(); openOverlay('settings-modal'); });
  $('btn-help').addEventListener('click', function () { buildHelp(); openOverlay('help-sheet'); });
  $('set-close').addEventListener('click', function () { closeOverlays(); flushSave(); });
  $('set-sound').addEventListener('click', function () { STATE.settings.sound = !STATE.settings.sound; syncSettingsUi(); markDirty(); });
  $('set-reduced').addEventListener('click', function () {
    STATE.settings.reduced = !STATE.settings.reduced; syncSettingsUi(); markDirty();
    if (VIEW) VIEW.applyEffects();
  });
  $('set-reset').addEventListener('click', function () {
    if (!UI.resetArmed) {
      UI.resetArmed = true; syncSettingsUi();
      clearTimeout(UI.resetT);
      UI.resetT = setTimeout(function () { UI.resetArmed = false; syncSettingsUi(); }, 4000);
    } else { clearTimeout(UI.resetT); doReset(); }
  });
  $('rate-btn').addEventListener('click', function () {
    STATE.rate = STATE.rate === 4 ? 1 : 4; markDirty(); syncHall();
    announce('Island rate ' + STATE.rate + ' yen a ball.');
  });
  $('counter-btn').addEventListener('click', function () { Sfx.unlock(); openCounter(); });
  $('case-btn').addEventListener('click', function () { buildCase(); openOverlay('case-sheet'); });
  $('cnt-body').addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t) return;
    if (t.id === 'cnt-close') { closeOverlays(); syncHall(); return; }
    if (t.id === 'cnt-special') { doSpecial(); syncHall(); return; }
    if (t.id === 'cnt-back') { counterStage('shelf'); return; }
    if (t.id === 'cnt-store') { STATE.stored += STATE.tray; STATE.tray = 0; markDirty(); flushSave(); counterStage('shelf'); syncHall(); return; }
    if (t.id === 'cnt-draw') { STATE.tray += STATE.stored; STATE.stored = 0; markDirty(); flushSave(); counterStage('shelf'); syncHall(); return; }
    var pid = t.getAttribute('data-prize');
    if (pid) { claimPrize(pid); syncHall(); }
  });
  $('rent-btn').addEventListener('click', function () {
    if (STATE.wallet >= ECON.bill) rent(); else stakeMe();
    syncHud(true); syncHall();
  });
  for (var i = 0; i < OVERLAYS.length; i++) {
    $(OVERLAYS[i]).addEventListener('click', function (e) { if (e.target === e.currentTarget) { closeOverlays(); syncHall(); } });
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && UI.overlay) { closeOverlays(); syncHall(); } });
  window.addEventListener('resize', resizeStage);
  window.addEventListener('orientationchange', function () { setTimeout(resizeStage, 250); });
  if (window.ResizeObserver) new ResizeObserver(function () { resizeStage(); }).observe($('pixi-host'));
  document.addEventListener('visibilitychange', function () { if (document.hidden) flushSave(); });
  window.addEventListener('pagehide', flushSave);
  setInterval(function () { if (UI.dirty) flushSave(); }, 1500);
  setInterval(function () { if (UI.screen === 'hall') tickToast(0.25); }, 250);
}

/* ===== SECTION 12: BOOT ===== */
function showFatal(title, body) {
  var e = $('cdn-error');
  if (e) {
    e.querySelector('h2').textContent = title;
    e.querySelector('p').textContent = body;
    e.classList.add('open');
  }
  document.body.classList.add('nopixi');
}
async function boot() {
  if (typeof PIXI === 'undefined') {
    showFatal('The renderer did not load', 'PixiJS could not be fetched from the network. Check your connection and reload the page.');
    return;
  }
  STATE = loadState();
  Sfx.on = function () { return !!(STATE && STATE.settings.sound); };
  bindUi();
  bindInput();
  renderSeatCards();
  setScreen('hall');
  var app = new PIXI.Application();
  /* v8 initializes asynchronously, so the application is awaited here and never at top level */
  await app.init({
    width: 320, height: 480, background: 0x05080e, antialias: true,
    resolution: Math.min(window.devicePixelRatio || 1, 2), autoDensity: true
  });
  APPX = app;
  var host = $('pixi-host');
  app.canvas.style.display = 'block';
  app.canvas.style.touchAction = 'none';
  host.appendChild(app.canvas);
  bakeTextures();
  app.ticker.add(frame);
  app.ticker.stop();
  if (document.fonts && document.fonts.ready) {
    await Promise.race([document.fonts.ready, new Promise(function (r) { setTimeout(r, 1200); })]);
  }
  document.documentElement.classList.add('ready');
}
document.addEventListener('DOMContentLoaded', function () {
  boot().catch(function (err) {
    if (window.console) console.error(err);
    showFatal('The renderer could not start', 'This browser could not start WebGL graphics. Try another browser or reload the page.');
  });
});
</script>
</body>
</html>
